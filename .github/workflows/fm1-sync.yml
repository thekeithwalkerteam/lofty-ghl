name: FM1 sync (Lofty -> GHL)

on:
  schedule:
    - cron: "17 * * * *"   # hourly at :17 UTC (GitHub cron is best-effort, not exact)
  workflow_dispatch:
    inputs:
      apply:
        description: "apply changes (true) or dry run (false)"
        required: false
        default: "true"

permissions:
  contents: read

concurrency:
  group: fm1-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LOFTY_API_TOKEN: ${{ secrets.LOFTY_API_TOKEN }}
      GHL_API_TOKEN: ${{ secrets.GHL_API_TOKEN }}
      GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
    steps:
      - uses: actions/checkout@v4

      # Scheduled runs APPLY (the job is idempotent & add/update-only).
      # Manual runs can dry-run by setting apply=false.
      - name: Run sync
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.apply }}" = "false" ]; then
            python3 sync_fm1.py
          else
            python3 sync_fm1.py --apply
          fi

      - name: Publish run report
        if: always()
        run: cat run_report.md >> "$GITHUB_STEP_SUMMARY" || true
